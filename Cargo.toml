[workspace]
members = ["codegen"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/iso15118"
homepage = "https://hupe1980.github.io/iso15118/"
authors = ["hupe1980"]

[package]
name = "iso15118"
description = "ISO 15118 vehicle-to-grid (V2G) communication — EXI codec, message sets, session engines and Plug & Charge signatures; sans-I/O and no_std-capable, for both EVCC and SECC"
categories = ["embedded", "encoding", "network-programming", "no-std"]
keywords = ["iso15118", "v2g", "ev", "charging", "exi"]
readme = "README.md"

# The package is the crate only: no site, scripts or Java tools. The gitignored
# directories are listed so a maintainer's tree cannot leak internal notes or the
# licensed ISO schemas into a package. `codegen/` and `fuzz/` have their own
# manifests, which Cargo skips.
exclude = [
  "/.claude",
  "/.github",
  "/.specify",
  "/concepts",
  "/deny.toml",
  "/scripts",
  "/site",
  "/specs",
  "/tools",
]

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = ["std", "iso2", "iso20", "sdp", "slac", "evcc", "secc", "pnc"]

# --- environment -------------------------------------------------------------
# The core is `no_std` and always needs `alloc`: a bit-packed EXI string cannot
# borrow from its input. `std` adds `std::error::Error` and `Ipv6Addr` helpers.
std = []

# --- roles -------------------------------------------------------------------
evcc = []
secc = []

# --- protocols ---------------------------------------------------------------
# One flag per generated schema set. Bidirectional power transfer is not a set:
# the `BPT_*` types live inside AC and DC.
iso2 = []
iso20 = ["iso20-ac", "iso20-dc", "iso20-wpt", "iso20-acdp", "iso20-ac-der-iec", "iso20-ac-der-sae"]
iso20-common = []
iso20-ac = ["iso20-common"]
iso20-dc = ["iso20-common"]
iso20-wpt = ["iso20-common"]
iso20-acdp = ["iso20-common"]
# ISO 15118-20 Amd 1 AC_DER (service ids 10, 11): each its own schema set, the
# AC messages as the DER schema extends them, independent of `iso20-ac`.
iso20-ac-der-iec = ["iso20-common"]
iso20-ac-der-sae = ["iso20-common"]

# --- link & discovery --------------------------------------------------------
sdp = []
slac = []

# --- security ----------------------------------------------------------------
# Plug & Charge and the V2G PKI. Hash, signature and key agreement are traits the
# caller implements; no crypto is pulled in.
pnc = ["iso20-common"]

# A RustCrypto backend for those traits (`sha2`, `p256`, `p521`, `aes`, `cbc`).
# Off by default: an ECU with a secure element implements the traits itself.
pnc-rustcrypto = ["pnc", "dep:aes", "dep:cbc", "dep:p256", "dep:p521", "dep:sha2"]

# --- integration -------------------------------------------------------------
serde = ["dep:serde"]
tracing = ["dep:tracing"]

[lints]
workspace = true

[dependencies]
serde = { version = "1", default-features = false, features = [
  "derive",
  "alloc",
], optional = true }
tracing = { version = "0.1", default-features = false, optional = true }

# `pnc-rustcrypto` only. All `no_std`; ECDSA signing is RFC 6979 deterministic,
# so no RNG is needed.
p256 = { version = "0.14", default-features = false, features = [
  "ecdsa",
  "ecdh",
], optional = true }
p521 = { version = "0.14", default-features = false, features = [
  "ecdsa",
], optional = true }
sha2 = { version = "0.11", default-features = false, optional = true }
# The contract-key envelope [V2G2-815]/[V2G2-817]: AES-128-CBC, two blocks, no
# padding.
aes = { version = "0.9", default-features = false, optional = true }
cbc = { version = "0.2", default-features = false, features = [
  "block-padding",
], optional = true }

# Used by unit tests inside `src/` as well as by `tests/`.
[dev-dependencies]
# Property tests of the bit reader/writer and the EXI primitives.
proptest = "1"
# Serde round trips through a real format (`src/protocol.rs`, `src/session/mod.rs`).
serde_json = "1"

# Every example needs sockets, so every example needs `std`.
[[example]]
name = "sdp_discovery"
required-features = ["std", "sdp"]

[[example]]
name = "secc_tcp"
required-features = ["std", "iso2", "secc"]

[[example]]
name = "evcc_tcp"
required-features = ["std", "iso2", "evcc"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic, except module-name repetition and mandatory `# Errors`/`# Panics` sections.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
lto = "thin"
