<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ get_url(path='@/_index.md') | safe }}">
      {% include "partials/logo.html" %}
      <span>iso15118</span>
    </a>

    <nav class="nav" aria-label="Main">
      <a href="{{ get_url(path='@/docs/_index.md') | safe }}"
         {% if current_path is defined and current_path is starting_with(pat="/docs") %}class="is-active"{% endif %}>Docs</a>
      <a class="hide-sm" href="{{ get_url(path='@/docs/getting-started.md') | safe }}">Get started</a>
      <a class="ext hide-sm" href="{{ config.extra.docsrs }}">API</a>
      <a class="ext" href="{{ config.extra.repo }}">GitHub</a>
      <button class="icon-btn" type="button" id="theme-toggle"
              aria-label="Switch between light and dark theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
        </svg>
      </button>
    </nav>
  </div>
</header>
