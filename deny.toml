# cargo-deny configuration.
#
# The dependency list is deliberately tiny — a charging-station stack should not
# pull in a tree it cannot audit — so these rules are strict on purpose.

[graph]
all-features = true

[licenses]
version = 2
# Everything in the tree must be usable under our own MIT OR Apache-2.0.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "Unicode-3.0"]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# No C or C++ in the build: the memory-safety argument for this crate only
# holds if the whole tree is Rust.
deny = [{ name = "openssl-sys" }, { name = "cc", wrappers = ["libfuzzer-sys"] }]

[advisories]
version = 2
yanked = "deny"
ignore = [
  # `astral-tokio-tar` is unmaintained (no vulnerability). It reaches this
  # repository only through the `testcontainers` dev-dependency, which tars the
  # Dockerfile context of the live-peer images; nothing it touches ships in the
  # crate. Drop this when a `testcontainers` release moves off it.
  { id = "RUSTSEC-2026-0440", reason = "dev-only, via testcontainers 0.28; unmaintained, not vulnerable" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
