name: Site

# The documentation site at site/ — built with Zola, published to GitHub Pages.
#
# Pull requests build it but do not deploy: a site that fails to build is a
# broken link or a template mistake, and finding that out in review is the point.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.23.4"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        run: |
          curl -sSfL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin zola
          zola --version

      # `zola check` walks every internal *and* external link. A 404 in the
      # documentation is a defect like any other, and this is where it is cheap
      # to find.
      - name: Check links
        run: zola --root site check

      # `--output-dir` is deliberately absent. Combined with `--root` it breaks
      # `get_url(cachebust=true)`: the SASS in `site/sass` compiles into the
      # chosen output directory, but the cache-busting hash is looked up
      # relative to the root's default `public/`, so the very first template to
      # render fails with "Could not find or open file main.css". Either flag
      # alone is fine; it is the pair that is not. Zola 0.23.4.
      - name: Build
        run: zola --root site build

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/public

  deploy:
    name: deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
