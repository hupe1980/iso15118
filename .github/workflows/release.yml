name: Release

# Publishing to crates.io is the one thing in this repository that cannot be
# undone. A version can be yanked, but never replaced or re-uploaded, and every
# `cargo vendor` copy keeps whatever went out. So the upload is gated behind the
# checks CI runs, plus the two it cannot make: that the tag and the manifest
# agree, and that the tarball holds the crate and nothing else.
#
# Cutting a release:
#
#   1. bump `version` under `[workspace.package]` in Cargo.toml
#   2. `cargo update -p iso15118` so Cargo.lock agrees, and commit both
#   3. `git tag v0.2.0 && git push origin v0.2.0`
#
# The tag is the whole trigger; everything below follows from it.
#
# Rehearsing: run this workflow by hand from the Actions tab. It verifies and
# packages exactly as a real release does and then stops — publishing happens
# only for a tag, because only a tag carries a version to check the manifest
# against.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One at a time, and never cancelled: a run interrupted between the crates.io
# upload and the GitHub release leaves the two disagreeing about what exists.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    # Warnings are errors for our own code, as in CI. Deliberately not set on
    # the publish job below: a release should not fail because a transitive
    # dependency picked up a new lint.
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2

      # The check CI cannot make, because CI knows nothing about tags. A tag
      # that disagrees with the manifest publishes a version nobody asked for
      # and leaves the repository pointing at bytes that do not exist.
      - name: Tag matches the manifest
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "iso15118") | .version')
          echo "tag $tag, manifest $crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi

      # `--locked` throughout: a release builds from the committed Cargo.lock,
      # not from whatever happened to resolve today.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked
      - run: cargo clippy --all-targets --no-default-features --locked
      - run: cargo test --workspace --all-features --locked
      - run: cargo test --no-default-features --locked

      - name: Docs build without warnings
        run: cargo doc --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      # The library is `no_std` by contract, and a release that quietly stopped
      # building for a microcontroller would keep that promise only in prose.
      - name: no_std (thumbv7em-none-eabihf)
        run: >
          cargo build --target thumbv7em-none-eabihf --no-default-features --locked
          --features iso2,iso20,sdp,slac,evcc,secc,pnc

      # What actually goes out, recorded in the job summary so the contents of a
      # published version can be read off the run that published it.
      - name: Package
        run: |
          cargo package --locked
          {
            echo '### Package contents'
            echo
            echo '```'
            cargo package --list --locked
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A consumer wants the library, not the project around it. `exclude` in
      # Cargo.toml keeps the documentation site, the Java tools and the shell
      # scripts out; this is what notices when that stops being true.
      - name: Nothing but the crate
        run: |
          if cargo package --list --locked | grep -E '^(site|tools|scripts|specs|\.github)/'; then
            echo "::error::project scaffolding is in the package; check exclude in Cargo.toml"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: crate
          path: target/package/*.crate
          if-no-files-found: error

  publish:
    name: publish to crates.io
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/iso15118
    permissions:
      # Trusted publishing: crates.io exchanges this run's OIDC identity for a
      # short-lived token, so there is no long-lived secret to leak or rotate.
      #
      # One-time setup on crates.io, under the crate's Settings ->
      # Trusted Publishing:
      #
      #   Repository owner    hupe1980
      #   Repository name     iso15118
      #   Workflow filename   release.yml     (must match this file exactly)
      #   Environment         crates-io       (optional; it is the `environment`
      #                                        above, and worth setting)
      #
      # For the very first publish crates.io has no crate to attach a publisher
      # to, so either reserve the name with a one-off token first or add the
      # publisher at the account level. If you would rather keep using a token,
      # delete the `auth` step and set `CARGO_REGISTRY_TOKEN` from a secret.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # `cargo publish` re-packages and builds the tarball before uploading, so
      # this is the last chance to catch a defect that only appears once the
      # crate is unpacked somewhere else — a file wrongly excluded, most of all.
      - run: cargo publish -p iso15118 --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  announce:
    name: github release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: crate
          path: dist

      # After the upload and never before: a release page announcing a version
      # crates.io rejected is worse than no release page. The `.crate` goes with
      # it as the exact bytes that were published.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
          dist/*.crate
